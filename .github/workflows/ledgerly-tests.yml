
name: Ledgerly Core Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Run automated tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check core JavaScript syntax
        run: node --check ledgerly-core.js

      - name: Run core tests
        run: node --test tests/ledgerly-core.test.cjs
